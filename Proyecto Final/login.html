<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LiceoMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="login-container reveal visible">
    <div class="login-header">
        <a href="proyecto.html" class="login-back">← Volver al inicio</a>
        <div class="logo">
            <div class="logo-icon">🎓</div>
            <h2>LiceoMap</h2>
        </div>
        <p>Ingresa tu RUT y contraseña para acceder a tu perfil.</p>
    </div>

    <form id="formLogin" onsubmit="procesarLogin(event)" class="login-form">
        <div class="input-group">
            <label for="rut">RUT</label>
            <input type="text" id="rut" placeholder="12.345.678-9" required autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
            <label class="checkbox-label">
                <input type="checkbox" id="recordar">
                <span>Recordarme</span>
            </label>
            <a href="#" class="olvido-pass">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login">Ingresar a la plataforma</button>
    </form>
</div>

<script>
function procesarLogin(e) {
    e.preventDefault();
    const rut = document.getElementById("rut").value.trim();
    
    let usuario = {
        rut: rut,
        nombre: "Estudiante LiceoMap",
        rol: "estudiante",
        curso: "3° Medio A"
    };

    if (rut.endsWith("k") || rut.endsWith("K") || rut.endsWith("1")) {
        usuario.nombre = "Profesor(a) LiceoMap";
        usuario.rol = "profesor";
        usuario.curso = "Docente";
    }

    localStorage.setItem("usuarioLiceo", JSON.stringify(usuario));
    window.location.href = "proyecto.html";
}
</script>
</body>
</html>
